<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSpend - 雲端即時同步記帳</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen pb-16 antialiased selection:bg-emerald-500 selection:text-white">

  <!-- 頂部導航欄 -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 sticky top-0 z-30 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 text-slate-950 font-bold text-lg">
          <i data-lucide="cloud" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white leading-tight">SmartSpend</h1>
          <div class="flex items-center space-x-1.5 text-xs text-slate-400">
            <span id="sync-indicator" class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>
            <span id="sync-status">連線設定中...</span>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <!-- 匯率狀態 -->
        <div class="hidden sm:flex items-center space-x-2 text-xs bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/60 text-slate-300">
          <span>1,000 KRW ≈ <strong class="text-emerald-400" id="rate-krw-text">5.60 HKD</strong></span>
        </div>
        <!-- 雲端設定按鈕 -->
        <button id="btn-open-settings" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700/60 flex items-center space-x-1.5 transition-all">
          <i data-lucide="settings" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">同步設定</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-6 space-y-6">

    <!-- 1. 核心數據卡片 -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="glass-card rounded-2xl p-5 relative overflow-hidden group">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">本月總支出</span>
          <div class="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center">
            <i data-lucide="trending-down" class="w-4 h-4"></i>
          </div>
        </div>
        <div class="text-2xl sm:text-3xl font-extrabold text-white" id="stat-expense">HK$ 0.00</div>
        <div class="text-xs text-slate-400 mt-1">共 <span id="stat-expense-count" class="text-slate-200 font-medium">0</span> 筆支出</div>
      </div>

      <div class="glass-card rounded-2xl p-5 relative overflow-hidden group">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">已累積儲蓄</span>
          <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
            <i data-lucide="piggy-bank" class="w-4 h-4"></i>
          </div>
        </div>
        <div class="text-2xl sm:text-3xl font-extrabold text-emerald-400" id="stat-saving">HK$ 0.00</div>
        <div class="text-xs text-slate-400 mt-1">共 <span id="stat-saving-count" class="text-slate-200 font-medium">0</span> 筆目標儲蓄</div>
      </div>

      <div class="glass-card rounded-2xl p-5 relative overflow-hidden group">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">本月淨結餘</span>
          <div class="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center">
            <i data-lucide="wallet" class="w-4 h-4"></i>
          </div>
        </div>
        <div class="text-2xl sm:text-3xl font-extrabold text-white" id="stat-balance">HK$ 0.00</div>
        <div class="text-xs text-slate-400 mt-1">總收入：<span id="stat-income" class="text-slate-200 font-medium">HK$ 0.00</span></div>
      </div>
    </div>

    <!-- 2. 主操作與視覺化區塊 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- 左側：新增交易卡片 -->
      <div class="lg:col-span-5 space-y-6">
        <div class="glass-card rounded-2xl p-6 relative">
          <h2 class="text-base font-bold text-white mb-4 flex items-center space-x-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-emerald-400"></i>
            <span>新增記帳 / 儲蓄</span>
          </h2>

          <form id="tx-form" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1.5">類型</label>
              <div class="grid grid-cols-3 gap-2 bg-slate-800/80 p-1 rounded-xl border border-slate-700/60">
                <button type="button" data-type="expense" class="type-btn active py-2 rounded-lg text-xs font-semibold transition-all bg-rose-500/20 text-rose-300 border border-rose-500/30 flex items-center justify-center space-x-1">
                  <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
                  <span>支出</span>
                </button>
                <button type="button" data-type="income" class="type-btn py-2 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-white flex items-center justify-center space-x-1">
                  <i data-lucide="arrow-down-left" class="w-3.5 h-3.5"></i>
                  <span>收入</span>
                </button>
                <button type="button" data-type="saving" class="type-btn py-2 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-white flex items-center justify-center space-x-1">
                  <i data-lucide="piggy-bank" class="w-3.5 h-3.5"></i>
                  <span>儲蓄</span>
                </button>
              </div>
              <input type="hidden" id="tx-type" value="expense">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1.5">金額 & 幣別</label>
              <div class="flex rounded-xl overflow-hidden border border-slate-700/80 focus-within:border-emerald-500 transition-all bg-slate-900/60">
                <select id="tx-currency" class="bg-slate-800 text-slate-200 text-xs font-semibold px-3 py-2.5 outline-none border-r border-slate-700/80">
                  <option value="HKD">HKD (港幣)</option>
                  <option value="KRW">KRW (韓元)</option>
                  <option value="JPY">JPY (日圓)</option>
                  <option value="USD">USD (美元)</option>
                </select>
                <input type="number" step="any" id="tx-amount" placeholder="0.00" required class="flex-1 bg-transparent px-3.5 py-2.5 text-sm text-white font-semibold outline-none placeholder:text-slate-600">
              </div>

              <div id="conversion-preview" class="hidden mt-2 px-3 py-2 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-xs text-emerald-300 flex items-center justify-between">
                <div class="flex items-center space-x-1.5">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                  <span>折合港幣：</span>
                </div>
                <span class="font-bold text-sm" id="preview-hkd-val">HK$ 0.00</span>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">類別</label>
                <select id="tx-category" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500">
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">日期</label>
                <input type="date" id="tx-date" required class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-emerald-500">
              </div>
            </div>

            <div class="grid grid-cols-1 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">支付方式 / 帳戶</label>
                <select id="tx-account" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500">
                  <option value="信用卡">信用卡 (Credit Card)</option>
                  <option value="現金">現金 (Cash)</option>
                  <option value="銀行轉帳">銀行轉帳 (FPS / Transfer)</option>
                  <option value="八達通/電子錢包">八達通 / PayMe / Alipay</option>
                  <option value="儲蓄專戶">儲蓄專用戶口 (Savings)</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">備註 / 說明 (選填)</label>
                <input type="text" id="tx-note" placeholder="例如：首爾烤肉、薪資入帳" class="w-full bg-slate-900/60 border border-slate-700/80 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500 placeholder:text-slate-600">
              </div>
            </div>

            <button type="submit" id="btn-submit" class="w-full mt-2 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2 active:scale-[0.98]">
              <i data-lucide="cloud-upload" class="w-4 h-4"></i>
              <span id="btn-submit-text">同步至雲端</span>
            </button>
          </form>
        </div>

        <div class="glass-card rounded-2xl p-5">
          <h3 class="text-sm font-bold text-white mb-3 flex items-center justify-between">
            <span>支出類別佔比</span>
            <i data-lucide="pie-chart" class="w-4 h-4 text-slate-400"></i>
          </h3>
          <div id="category-bars" class="space-y-3">
            <p class="text-xs text-slate-500 text-center py-4">尚無支出資料</p>
          </div>
        </div>
      </div>

      <!-- 右側：交易紀錄列表 -->
      <div class="lg:col-span-7 space-y-4">
        <div class="glass-card rounded-2xl p-6 h-full flex flex-col">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-800 gap-3">
            <div>
              <h2 class="text-base font-bold text-white flex items-center space-x-2">
                <i data-lucide="list" class="w-5 h-5 text-teal-400"></i>
                <span>雲端明細紀錄</span>
              </h2>
              <p class="text-xs text-slate-400 mt-0.5">跨裝置即時讀取自 Google Sheets</p>
            </div>
            <div class="flex items-center space-x-2">
              <button id="btn-manual-sync" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700/60 flex items-center space-x-1.5 transition-all">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="sync-spin-icon"></i>
                <span>重新整理</span>
              </button>
              <button id="btn-export-csv" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700/60 flex items-center space-x-1.5 transition-all">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>匯出</span>
              </button>
            </div>
          </div>

          <div class="flex items-center space-x-2 py-3 overflow-x-auto text-xs">
            <button data-filter="all" class="filter-btn px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium">全部</button>
            <button data-filter="expense" class="filter-btn px-3 py-1 rounded-full bg-slate-800 text-slate-400 hover:text-white transition-all">支出</button>
            <button data-filter="income" class="filter-btn px-3 py-1 rounded-full bg-slate-800 text-slate-400 hover:text-white transition-all">收入</button>
            <button data-filter="saving" class="filter-btn px-3 py-1 rounded-full bg-slate-800 text-slate-400 hover:text-white transition-all">儲蓄</button>
          </div>

          <div id="tx-list" class="space-y-2.5 overflow-y-auto max-h-[540px] pr-1 custom-scrollbar flex-1">
            <div class="text-center py-12 text-slate-500 space-y-2">
              <i data-lucide="loader-2" class="w-8 h-8 mx-auto stroke-[1.5] animate-spin text-emerald-400"></i>
              <p class="text-xs">正在從雲端載入資料...</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- 雲端設定彈窗 (Modal) -->
  <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass-card w-full max-w-md rounded-2xl p-6 border border-slate-700/80 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-white flex items-center space-x-2">
          <i data-lucide="link" class="w-5 h-5 text-emerald-400"></i>
          <span>Google 試算表同步設定</span>
        </h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <p class="text-xs text-slate-300 leading-relaxed">
        請貼上你部署的 Google Apps Script <strong>Web app URL</strong>。所有裝置只要填入相同的 URL 即可完全同步。
      </p>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Apps Script 部署網址</label>
        <input type="url" id="api-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-emerald-500 font-mono">
      </div>
      <div class="flex space-x-3 pt-2">
        <button id="btn-save-api" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition-all">儲存並同步</button>
      </div>
    </div>
  </div>

  <script>
    let exchangeRates = { HKD: 1.0, KRW: 0.0056, JPY: 0.051, USD: 7.82 };
    const categories = {
      expense: ['餐飲美食', '交通出行', '購物休閒', '娛樂休閒', '居住水電', '醫療健康', '其他支出'],
      income: ['薪資收入', '獎金分紅', '投資回報', '兼職副業', '其他收入'],
      saving: ['旅遊基金', '緊急備用金', '退休投資', '大件購買計畫', '一般儲蓄']
    };

    let transactions = JSON.parse(localStorage.getItem('smartspend_records')) || [];
    let currentFilter = 'all';
    let apiUrl = localStorage.getItem('smartspend_api_url') || '';

    async function fetchLiveRates() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/HKD');
        if (res.ok) {
          const data = await res.json();
          if (data && data.rates) {
            exchangeRates.KRW = +(1 / data.rates.KRW).toFixed(6);
            exchangeRates.JPY = +(1 / data.rates.JPY).toFixed(5);
            exchangeRates.USD = +(1 / data.rates.USD).toFixed(4);
            const el = document.getElementById('rate-krw-text');
            if (el) el.textContent = `${(exchangeRates.KRW * 1000).toFixed(2)} HKD`;
          }
        }
      } catch (err) {
        console.warn('匯率載入失敗，使用預設值', err);
      }
    }

    // 從 Google Sheets 抓取最新資料
    async function syncFromCloud() {
      if (!apiUrl) {
        updateSyncStatus(false, '尚未設定 Google Sheets 連線');
        document.getElementById('settings-modal').classList.remove('hidden');
        renderDashboard();
        return;
      }

      updateSyncStatus(null, '同步中...');
      const spinIcon = document.getElementById('sync-spin-icon');
      if (spinIcon) spinIcon.classList.add('animate-spin');

      try {
        const res = await fetch(apiUrl);
        if (res.ok) {
          const data = await res.json();
          transactions = Array.isArray(data) ? data : [];
          localStorage.setItem('smartspend_records', JSON.stringify(transactions));
          updateSyncStatus(true, '已與雲端同步');
        } else {
          throw new Error('無法讀取');
        }
      } catch (err) {
        console.error(err);
        updateSyncStatus(false, '雲端連線異常 (使用本地快取)');
      } finally {
        if (spinIcon) spinIcon.classList.remove('animate-spin');
        renderDashboard();
      }
    }

    function updateSyncStatus(isSuccess, text) {
      const dot = document.getElementById('sync-indicator');
      const label = document.getElementById('sync-status');
      label.textContent = text;
      if (isSuccess === true) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-400 inline-block';
      } else if (isSuccess === false) {
        dot.className = 'w-2 h-2 rounded-full bg-rose-400 inline-block';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse inline-block';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('tx-date').value = new Date().toISOString().split('T')[0];
      renderCategoryOptions('expense');
      lucide.createIcons();
      fetchLiveRates();

      if (apiUrl) {
        document.getElementById('api-url-input').value = apiUrl;
        syncFromCloud();
      } else {
        document.getElementById('settings-modal').classList.remove('hidden');
        renderDashboard();
      }

      // 類型切換
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const type = e.currentTarget.dataset.type;
          document.getElementById('tx-type').value = type;
          document.querySelectorAll('.type-btn').forEach(b => {
            b.className = 'type-btn py-2 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-white flex items-center justify-center space-x-1';
          });
          const colorMap = {
            expense: 'bg-rose-500/20 text-rose-300 border-rose-500/30',
            income: 'bg-blue-500/20 text-blue-300 border-blue-500/30',
            saving: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'
          };
          e.currentTarget.className = `type-btn active py-2 rounded-lg text-xs font-semibold transition-all ${colorMap[type]} border flex items-center justify-center space-x-1`;
          renderCategoryOptions(type);
          updatePreview();
        });
      });

      document.getElementById('tx-amount').addEventListener('input', updatePreview);
      document.getElementById('tx-currency').addEventListener('change', updatePreview);
      document.getElementById('tx-form').addEventListener('submit', handleAddTransaction);

      // 設定 Modal 事件
      document.getElementById('btn-open-settings').addEventListener('click', () => {
        document.getElementById('api-url-input').value = apiUrl;
        document.getElementById('settings-modal').classList.remove('hidden');
      });
      document.getElementById('btn-close-modal').addEventListener('click', () => {
        document.getElementById('settings-modal').classList.add('hidden');
      });
      document.getElementById('btn-save-api').addEventListener('click', () => {
        const val = document.getElementById('api-url-input').value.trim();
        if (val) {
          apiUrl = val;
          localStorage.setItem('smartspend_api_url', apiUrl);
          document.getElementById('settings-modal').classList.add('hidden');
          syncFromCloud();
        }
      });

      document.getElementById('btn-manual-sync').addEventListener('click', syncFromCloud);
      document.getElementById('btn-export-csv').addEventListener('click', exportToCSV);

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-btn').forEach(b => {
            b.className = 'filter-btn px-3 py-1 rounded-full bg-slate-800 text-slate-400 hover:text-white transition-all';
          });
          e.currentTarget.className = 'filter-btn px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium';
          currentFilter = e.currentTarget.dataset.filter;
          renderList();
        });
      });
    });

    function renderCategoryOptions(type) {
      const select = document.getElementById('tx-category');
      select.innerHTML = '';
      categories[type].forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function updatePreview() {
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const currency = document.getElementById('tx-currency').value;
      const previewBox = document.getElementById('conversion-preview');
      const previewVal = document.getElementById('preview-hkd-val');

      if (!amount || isNaN(amount)) {
        previewBox.classList.add('hidden');
        return;
      }

      const rate = exchangeRates[currency] || 1.0;
      const hkdAmount = amount * rate;

      if (currency !== 'HKD') {
        previewBox.classList.remove('hidden');
        previewVal.textContent = `HK$ ${hkdAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      } else {
        previewBox.classList.add('hidden');
      }
    }

    async function handleAddTransaction(e) {
      e.preventDefault();
      const type = document.getElementById('tx-type').value;
      const currency = document.getElementById('tx-currency').value;
      const originalAmount = parseFloat(document.getElementById('tx-amount').value);
      const rate = exchangeRates[currency] || 1.0;
      const amountHKD = +(originalAmount * rate).toFixed(2);
      const category = document.getElementById('tx-category').value;
      const date = document.getElementById('tx-date').value;
      const account = document.getElementById('tx-account').value;
      const note = document.getElementById('tx-note').value.trim();

      if (!originalAmount || originalAmount <= 0) return;

      const newTx = {
        id: Date.now().toString(),
        type,
        category,
        originalAmount,
        currency,
        rate,
        amountHKD,
        date,
        account,
        note
      };

      // 樂觀更新 (先更新 UI)
      transactions.unshift(newTx);
      localStorage.setItem('smartspend_records', JSON.stringify(transactions));
      renderDashboard();

      document.getElementById('tx-amount').value = '';
      document.getElementById('tx-note').value = '';
      document.getElementById('conversion-preview').classList.add('hidden');

      // 同步到 Google Sheets
      if (apiUrl) {
        updateSyncStatus(null, '正在寫入雲端...');
        try {
          await fetch(apiUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'add', data: newTx })
          });
          updateSyncStatus(true, '已與雲端同步');
        } catch (err) {
          updateSyncStatus(false, '寫入雲端失敗 (已存本地)');
        }
      }
    }

    window.deleteTx = async function(id) {
      if (!confirm('確定要刪除這筆紀錄嗎？')) return;
      transactions = transactions.filter(t => t.id !== id);
      localStorage.setItem('smartspend_records', JSON.stringify(transactions));
      renderDashboard();

      if (apiUrl) {
        updateSyncStatus(null, '正在從雲端刪除...');
        try {
          await fetch(apiUrl, {
            method: 'POST',
            body: JSON.stringify({ action: 'delete', id: id })
          });
          updateSyncStatus(true, '已與雲端同步');
        } catch (err) {
          updateSyncStatus(false, '雲端刪除失敗');
        }
      }
    };

    function renderDashboard() {
      let totalExpense = 0, totalIncome = 0, totalSaving = 0;
      let expenseCount = 0, savingCount = 0;
      const categoryExpenseMap = {};

      transactions.forEach(t => {
        if (t.type === 'expense') {
          totalExpense += t.amountHKD;
          expenseCount++;
          categoryExpenseMap[t.category] = (categoryExpenseMap[t.category] || 0) + t.amountHKD;
        } else if (t.type === 'income') {
          totalIncome += t.amountHKD;
        } else if (t.type === 'saving') {
          totalSaving += t.amountHKD;
          savingCount++;
        }
      });

      const netBalance = totalIncome - totalExpense - totalSaving;
      const fmt = (num) => 'HK$ ' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

      document.getElementById('stat-expense').textContent = fmt(totalExpense);
      document.getElementById('stat-expense-count').textContent = expenseCount;
      document.getElementById('stat-saving').textContent = fmt(totalSaving);
      document.getElementById('stat-saving-count').textContent = savingCount;
      document.getElementById('stat-balance').textContent = fmt(netBalance);
      document.getElementById('stat-income').textContent = fmt(totalIncome);

      renderCategoryBars(categoryExpenseMap, totalExpense);
      renderList();
    }

    function renderCategoryBars(catMap, totalExpense) {
      const container = document.getElementById('category-bars');
      if (totalExpense === 0 || Object.keys(catMap).length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">尚無支出資料</p>';
        return;
      }
      const colors = ['bg-rose-500', 'bg-amber-500', 'bg-teal-500', 'bg-indigo-500', 'bg-pink-500'];
      let html = '', i = 0;
      for (const [cat, val] of Object.entries(catMap).sort((a, b) => b[1] - a[1])) {
        const percent = ((val / totalExpense) * 100).toFixed(1);
        html += `
          <div>
            <div class="flex justify-between text-xs mb-1">
              <span class="text-slate-300 font-medium">${cat}</span>
              <span class="text-slate-400">HK$ ${val.toLocaleString('en-US', { minimumFractionDigits: 1 })} (${percent}%)</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
              <div class="${colors[i % colors.length]} h-1.5 rounded-full" style="width: ${percent}%"></div>
            </div>
          </div>
        `;
        i++;
      }
      container.innerHTML = html;
    }

    function renderList() {
      const container = document.getElementById('tx-list');
      const filtered = transactions.filter(t => currentFilter === 'all' || t.type === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500 space-y-2">
            <i data-lucide="inbox" class="w-8 h-8 mx-auto stroke-[1.5]"></i>
            <p class="text-xs">目前沒有符合條件的紀錄</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      let html = '';
      filtered.forEach(item => {
        let badgeColor = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
        let sign = '-';
        let iconName = 'shopping-bag';

        if (item.type === 'income') {
          badgeColor = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
          sign = '+';
          iconName = 'arrow-down-left';
        } else if (item.type === 'saving') {
          badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
          sign = '';
          iconName = 'piggy-bank';
        }

        const isForeign = item.currency !== 'HKD';
        const origText = isForeign 
          ? `<span class="text-xs text-amber-400/90 font-mono">(${item.originalAmount.toLocaleString()} ${item.currency})</span>` 
          : '';

        html += `
          <div class="p-3.5 rounded-xl bg-slate-800/40 hover:bg-slate-800/80 border border-slate-700/50 transition-all flex items-center justify-between group">
            <div class="flex items-center space-x-3">
              <div class="w-9 h-9 rounded-xl ${badgeColor} border flex items-center justify-center">
                <i data-lucide="${iconName}" class="w-4 h-4"></i>
              </div>
              <div>
                <div class="flex items-center space-x-2">
                  <span class="text-sm font-semibold text-white">${item.category}</span>
                  <span class="text-[10px] px-1.5 py-0.5 rounded ${badgeColor} border font-medium">${item.account}</span>
                </div>
                <div class="text-xs text-slate-400 flex items-center space-x-2 mt-0.5">
                  <span>${item.date}</span>
                  ${item.note ? `<span>•</span><span class="text-slate-300 truncate max-w-[140px] sm:max-w-[200px]">${item.note}</span>` : ''}
                </div>
              </div>
            </div>

            <div class="flex items-center space-x-3">
              <div class="text-right">
                <div class="text-sm font-bold ${item.type === 'income' ? 'text-blue-400' : (item.type === 'saving' ? 'text-emerald-400' : 'text-slate-100')}">
                  ${sign}HK$ ${item.amountHKD.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                </div>
                ${origText}
              </div>
              <button onclick="deleteTx('${item.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 transition-all p-1" title="刪除">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      lucide.createIcons();
    }

    function exportToCSV() {
      if (transactions.length === 0) return alert('目前沒有資料可匯出');
      let csv = '\uFEFF日期,類型,類別,原始金額,幣別,參考匯率,折算港幣(HKD),帳戶,備註\n';
      transactions.forEach(t => {
        csv += `"${t.date}","${t.type}","${t.category}","${t.originalAmount}","${t.currency}","${t.rate}","${t.amountHKD}","${t.account}","${(t.note || '').replace(/"/g, '""')}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `SmartSpend_記帳匯出_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
