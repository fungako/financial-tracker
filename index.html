            <!-- 1. 分類與日期區塊 (使用 Flex 完美適應手機) -->
            <div class="flex gap-3">
              <div class="flex-1 min-w-0">
                <label class="block text-sm font-black mb-2 uppercase text-memo-text">分類</label>
                <select id="tx-category" class="w-full bg-white border-[3px] border-memo-border px-3 py-3 text-sm font-bold outline-none shadow-[4px_4px_0_0_#475569] cursor-pointer text-memo-text">
                </select>
              </div>
              <div class="w-[140px] shrink-0">
                <label class="block text-sm font-black mb-2 uppercase text-memo-text">日期</label>
                <input type="date" id="tx-date" required class="w-full bg-white border-[3px] border-memo-border px-2 py-3 text-sm font-bold outline-none shadow-[4px_4px_0_0_#475569] text-memo-text">
              </div>
            </div>

            <!-- 2. 支付方式與備註區塊 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div>
                <label class="block text-sm font-black mb-2 uppercase text-memo-text">支付方式</label>
                <select id="tx-account" class="w-full bg-white border-[3px] border-memo-border px-3 py-3 text-sm font-bold outline-none shadow-[4px_4px_0_0_#475569] cursor-pointer text-memo-text">
                  <option value="信用卡">信用卡</option>
                  <option value="現金">現金</option>
                  <option value="銀行轉帳">銀行轉帳/FPS</option>
                  <option value="八達通/電子錢包">八達通/PayMe</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-black mb-2 uppercase text-memo-text">備註說明</label>
                <input type="text" id="tx-note" placeholder="例如：買了金容仙新專..." class="w-full bg-white border-[3px] border-memo-border px-4 py-3 text-sm font-bold outline-none shadow-[4px_4px_0_0_#475569] placeholder:text-slate-400 text-memo-text">
              </div>
            </div>
